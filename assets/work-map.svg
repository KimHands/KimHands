<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
<title id="t">프로젝트별 역량 근거 지도</title><desc id="d">HyperChecker: 에이전트 근거 있음, 검증 근거 있음, 보안 근거 있음, 운영 근거 있음. opsmith: 에이전트 근거 있음, 검증 근거 있음, 보안 일부, 운영 일부. hwpx-toolkit: 에이전트 근거 있음, 검증 근거 있음, 보안 없음, 운영 일부. humanize-korean-formal: 에이전트 근거 있음, 검증 근거 있음, 보안 없음, 운영 없음. islab-platform: 에이전트 일부, 검증 근거 있음, 보안 근거 있음, 운영 근거 있음. Bridge: 에이전트 일부, 검증 근거 있음, 보안 근거 있음, 운영 일부. KeylessPlay: 에이전트 없음, 검증 근거 있음, 보안 근거 있음, 운영 없음. Hedgehog WebCTF: 에이전트 없음, 검증 근거 있음, 보안 근거 있음, 운영 근거 있음. ClassFileAuto: 에이전트 없음, 검증 없음, 보안 근거 있음, 운영 근거 있음.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}.title{font-size:16px;font-weight:600}.head{font-size:13px;font-weight:600}.name{font-size:14px;font-weight:600}.note{font-size:12.5px}.ink{fill:#1F2328}.muted{fill:#59636E}.mark{fill:#7C3AED}.ring{stroke:#7C3AED}.line{stroke:#D1D9E0}@media (prefers-color-scheme:dark){.ink{fill:#E6EDF3}.muted{fill:#9198A1}.mark{fill:#8B5CF6}.ring{stroke:#8B5CF6}.line{stroke:#3D444D}}</style>
